name: Java CI with Gradle

on:
  push:
    branches: [ "**" ] # Triggers on any branch
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # 'build' creates the jar. 
      # We use --no-daemon for CI environments to save memory.
      run: ./gradlew build --no-daemon

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: manyideas-core-jar
        # This path looks for the built jar in the build/libs folder.
        # It excludes -sources and -dev jars if the mod creates them.
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar